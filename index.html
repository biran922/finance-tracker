<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הוצאות">
<meta name="theme-color" content="#f3f5f4">
<title>מעקב הוצאות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* תוכנית: לשוניות תחתונות (בית · עסקאות · קבועים · כסף · הגדרות), כרטיסים על רקע אפור-ירקרק, ירוק "שטר" עמוק כצבע פעולה */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17231f;
  --muted: #5f6d68;
  --line: #dde3e0;
  --accent: #0d6b52;
  --accent-soft: #e2f0ea;
  --danger: #b3261e;
  --ok: #1f7a3a;
  --font-display: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #18211e; --ink: #e8efec; --muted: #9aa8a2;
    --line: #2a3531; --accent: #4cc79f; --accent-soft: #1c3a30; --danger: #ff8a80; --ok: #6fd18c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #18211e; --ink: #e8efec; --muted: #9aa8a2;
  --line: #2a3531; --accent: #4cc79f; --accent-soft: #1c3a30; --danger: #ff8a80; --ok: #6fd18c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 0 32px; }
.center { align-items: center; justify-content: center; text-align: center; }
.lead { color: var(--muted); max-width: 34ch; margin: 0; }

.logo {
  width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-display); font-size: 38px; font-weight: 700;
}
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; cursor: pointer;
  background: var(--accent); color: var(--surface); width: 100%;
}
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn.link { background: none; color: var(--accent); width: auto; padding: 8px; }

/* מקלדת קוד */
.pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.pad-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.pad-msg { min-height: 48px; color: var(--muted); font-size: 15px; max-width: 30ch; text-align: center; }
.pad-msg.error { color: var(--danger); }
.dots { display: flex; gap: 16px; direction: ltr; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.6px solid var(--ink); transition: background .1s; }
.dot.on { background: var(--ink); }
.shake { animation: shake .36s; }
@keyframes shake { 20%{transform:translateX(-12px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(7px)} }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; direction: ltr; }
.key {
  width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset;
  font-family: var(--font-display); font-size: 30px; font-weight: 500;
  font-variant-numeric: tabular-nums; transition: transform .08s, background .08s;
}
.key:active { transform: scale(.94); background: var(--accent-soft); }
.key.plain { background: none; box-shadow: none; font-size: 15px; font-family: var(--font-body); font-weight: 600; }
.key:disabled { opacity: .35; }
.key.hidden { visibility: hidden; }
.busy .keys { opacity: .5; pointer-events: none; }

/* בית */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 30px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; display: grid; place-items: center;
}
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); }
.actions { display: flex; gap: 8px; }
.card {
  background: var(--surface); border-radius: 18px; padding: 16px 18px;
  box-shadow: 0 0 0 1px var(--line) inset; display: flex; gap: 14px; align-items: flex-start;
}
.card .chip {
  flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 700;
}
.card .chip.ok { color: var(--ok); }
.card h3 { font-size: 17px; margin-bottom: 2px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* הגדרות */
.section-label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; margin: 8px 4px -4px; }
.group { background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px var(--line) inset; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row button.row-btn { all: unset; cursor: pointer; display: flex; justify-content: space-between; width: 100%; }
.row .val { color: var(--muted); font-size: 15px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 14px 14px; }
.seg button {
  border: 0; border-radius: 10px; padding: 9px 4px; cursor: pointer; font-size: 14px; font-weight: 600;
  background: var(--bg); color: var(--ink);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.footnote { color: var(--muted); font-size: 13px; padding: 0 4px; margin: 0; }

#cover {
  position: fixed; inset: 0; background: var(--bg); z-index: 50;
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
}
#cover.show { display: flex; }
#toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60;
}
#toast.show { opacity: 1; }

/* שלב 2 */
.card.col { flex-direction: column; align-items: stretch; gap: 10px; }
.field {
  width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
}
.field:focus { outline: none; border-color: var(--accent); }
.err { color: var(--danger); }
.muted { color: var(--muted); }
.cycles, .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.cycles::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
.cycles button {
  flex: none; border: 0; border-radius: 14px; padding: 8px 14px; cursor: pointer; text-align: center;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; line-height: 1.25;
}
.cycles button span { font-weight: 700; }
.cycles button small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cycles button[aria-pressed="true"] { background: var(--accent); box-shadow: none; }
.cycles button[aria-pressed="true"] span, .cycles button[aria-pressed="true"] small { color: var(--surface); }
.filters button {
  flex: none; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.summary { background: var(--surface); border-radius: 20px; padding: 18px; box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; gap: 8px; }
.summary-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge-cal { background: #1b4f9c; color: #fff; border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 13px; }
.card-name { font-weight: 700; }
.big { font-family: var(--font-display); font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sub { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.split { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.split div { background: var(--bg); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; }
.split small { color: var(--muted); font-size: 12px; }
.split b { font-variant-numeric: tabular-nums; font-size: 15px; }
.note { font-size: 14px; color: var(--muted); }
.note b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, #d98a00 18%, transparent); color: #a35f00; }
:root[data-theme="dark"] .pill.warn { color: #ffbe55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.warn { color: #ffbe55; } }
.txlist { display: flex; flex-direction: column; gap: 8px; }
.day { font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 4px 0; }
.tx { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.tx:first-child { border-top: 0; }
.tx-main { min-width: 0; }
.tx-name { font-weight: 600; overflow-wrap: anywhere; }
.tx-sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tx-amt { text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }
.tx-amt small { font-weight: 400; font-size: 12px; color: var(--muted); }
#updateBar {
  position: sticky; top: 0; z-index: 40; max-width: 480px; margin: 8px auto 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; font-weight: 600;
}
#updateBar[hidden] { display: none; }
#updateBar button { border: 0; border-radius: 10px; padding: 6px 14px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }

/* שלב 3א */
:root { --c1: #0d6b52; --c2: #2f7fb8; --c3: #c07a12; --c4: #8a8f8d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c1: #4cc79f; --c2: #6cb4ee; --c3: #f0ad4e; --c4: #9aa8a2; } }
:root[data-theme="dark"] { --c1: #4cc79f; --c2: #6cb4ee; --c3: #f0ad4e; --c4: #9aa8a2; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; direction: ltr; letter-spacing: .04em; }
.review-bar {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; cursor: pointer; text-align: right;
  background: color-mix(in srgb, #d98a00 16%, var(--surface)); border-radius: 14px; padding: 12px 14px; font-weight: 700;
}
.review-bar span:nth-child(2) { flex: 1; }
.review-bar .count { background: #d98a00; color: #fff; border-radius: 999px; min-width: 28px; padding: 2px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.cats { display: flex; flex-direction: column; gap: 4px; }
.catrow {
  display: grid; grid-template-columns: minmax(0, 9.5em) 1fr auto; align-items: center; gap: 10px;
  border: 0; background: none; padding: 8px 6px; border-radius: 10px; cursor: pointer; text-align: right; width: 100%;
}
.catrow[aria-pressed="true"] { background: var(--bg); }
.catrow b { font-variant-numeric: tabular-nums; font-size: 15px; }
.catname { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.catname i, .catchip i { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 99px; }
.catchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
button.tx { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: right; font: inherit; color: inherit; }
.group button.tx:first-child { border-top: 0; }
button.tx:active { background: var(--bg); }
.tx-main, .tx-name, .tx-sub { display: block; }
.tx-sub { display: flex; }
.check { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--line) inset; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.row.head { background: var(--bg); }
.subgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 12px 14px 14px; }
.subbtn { border: 0; border-radius: 10px; padding: 10px 8px; cursor: pointer; font-weight: 600; font-size: 15px; background: var(--bg); color: var(--ink); }
.subbtn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.sel { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); max-width: 58%; }
.rk { background: var(--surface); border-radius: 14px; padding: 18px; font-size: 20px; text-align: center; box-shadow: 0 0 0 1.5px var(--accent) inset; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.danger-card { box-shadow: 0 0 0 1.5px var(--danger) inset; }
.danger-card label { font-size: 15px; }

/* שלב 3ב */
:root { --c5: #c2410c; --pos: #1f7a3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c5: #fb923c; --pos: #6fd18c; } }
:root[data-theme="dark"] { --c5: #fb923c; --pos: #6fd18c; }
.pos { color: var(--pos); }
.navrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.navbtn, .navcard {
  border: 0; cursor: pointer; text-align: right; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset;
  border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; font: inherit; color: inherit;
}
.navbtn small, .navcard small { color: var(--muted); font-size: 13px; }
.navcard { flex-direction: row; align-items: center; gap: 12px; width: 100%; }
.navcard > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
button.summary { border: 0; cursor: pointer; text-align: right; font: inherit; color: inherit; width: 100%; }
.money .mrow { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.money .mrow small { color: var(--muted); font-size: 12px; }
.money .mrow.minus b { color: var(--danger); }
.money .mrow.total { border-top: 1px solid var(--line); padding-top: 8px; font-size: 18px; }
.split.two { grid-template-columns: 1fr 1fr; }
.pill.bank { background: color-mix(in srgb, var(--c2) 16%, transparent); color: var(--c2); }
.tx-note { font-size: 13px; color: var(--ink); opacity: .75; font-style: italic; }
.row.bill { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: right; font: inherit; color: inherit; align-items: flex-start; }
.group .row.bill:first-child { border-top: 0; }
.bill-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bill-main small { color: var(--muted); font-size: 13px; }
.bill-amt { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bill-amt small { color: var(--muted); font-size: 12px; }
.field.small { width: 9em; flex: none; text-align: left; direction: ltr; }
.danger-link { color: var(--danger) !important; }
.catrow.static { cursor: default; }
label.row-btn { cursor: pointer; display: flex; justify-content: space-between; width: 100%; }

/* ===== עיצוב 5.0: לשוניות, מסך ראשי מינימלי, חלוניות ===== */
:root {
  --bg: #f4f5f2; --line: #e3e7e4;
  --elev: 0 0 0 1px rgba(23,35,31,.045), 0 8px 24px -14px rgba(23,35,31,.22);
  --hero-a: #11624b; --hero-b: #0a4535; --hero-ink: #ffffff; --hero-muted: rgba(255,255,255,.72);
  --tabbar: rgba(250,251,249,.82);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1311; --line: #26302c; --elev: 0 0 0 1px #222c28;
  --hero-a: #1b3a30; --hero-b: #12261f; --hero-ink: #e8efec; --hero-muted: rgba(232,239,236,.66); --tabbar: rgba(20,27,24,.82);
} }
:root[data-theme="dark"] {
  --bg: #0d1311; --line: #26302c; --elev: 0 0 0 1px #222c28;
  --hero-a: #1b3a30; --hero-b: #12261f; --hero-ink: #e8efec; --hero-muted: rgba(232,239,236,.66); --tabbar: rgba(20,27,24,.82);
}
.card, .group, .summary, .check, .icon-btn, .cycles button, .filters button, .key { box-shadow: var(--elev); }
.card, .group, .summary { border-radius: 20px; }
.screen { gap: 16px; }
.screen.has-tabs { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
.topbar h1, .pagehead h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
.btn { border-radius: 16px; }
.btn.light { background: var(--hero-ink); color: var(--hero-a); }
body:has(.tabbar) #toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.center-text { text-align: center; }

/* כותרת עמוד */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 15px; font-weight: 600; }

/* כרטיס ראשי */
.hero {
  border-radius: 26px; padding: 18px 20px 22px; color: var(--hero-ink);
  background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--hero-a) 70%, #3fb98f) 0%, transparent 55%), linear-gradient(160deg, var(--hero-a), var(--hero-b));
  display: flex; flex-direction: column; gap: 4px; box-shadow: 0 18px 40px -24px rgba(10,69,53,.7);
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; min-height: 36px; }
.hero-label { color: var(--hero-muted); font-size: 15px; font-weight: 600; }
.hero-num { font-family: var(--font-display); font-size: 44px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-sub { color: var(--hero-muted); font-size: 14px; margin-top: 6px; }
.hero-warn { color: #ffd38a; font-weight: 700; }
.hero-tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.14); }
.hero-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 12px; }
.hero-rows div { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
.hero-rows span { color: var(--hero-muted); }
.hero.empty { align-items: center; text-align: center; gap: 10px; padding: 32px 22px; }
.hero.empty .logo { background: rgba(255,255,255,.14); color: var(--hero-ink); }
.hero.empty p { margin: 0 0 8px; color: var(--hero-muted); max-width: 32ch; }

/* בורר חודש */
.month-pill {
  display: inline-flex; align-items: center; gap: 4px; border: 0; cursor: pointer;
  border-radius: 999px; padding: 7px 12px 7px 10px; font-weight: 700; font-size: 15px;
  background: var(--surface); color: var(--ink); box-shadow: var(--elev);
}

<body>
<div id="updateBar" hidden><span>גרסה חדשה זמינה</span><button id="doUpdate" type="button">עדכון</button></div>
<div id="app"></div>
<div id="cover" aria-hidden="true"><div class="logo">₪</div><div class="lead">מעקב הוצאות</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   מעקב הוצאות — אפליקציית ווב אישית. כל הנתונים במכשיר בלבד, מוצפנים.
   ============================================================ */
const APP_VERSION = "5.1.0";

/* ========= אחסון (במכשיר בלבד) =========
   ראשי: IndexedDB. גיבוי: localStorage (אם IndexedDB חסום בדפדפן).
   בשניהם הנתונים כבר מוצפנים לפני השמירה. */
const DB_NAME = "finance-tracker", STORE = "kv", LS_PREFIX = "ft:";
let backend = null;
let lastStorageError = "";
let dbPromise = null;

function openDB() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("blocked"));
    } catch (e) { rej(e); }
  });
  return dbPromise;
}
async function idb(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const b64 = u8 => { let s = ""; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const lsEncode = v => JSON.stringify(v, (k, x) => x instanceof Uint8Array ? { __u8: b64(x) } : x);
const lsDecode = t => t == null ? undefined : JSON.parse(t, (k, x) => x && typeof x === "object" && "__u8" in x ? unb64(x.__u8) : x);

async function pickBackend() {
  const errs = [];
  try {
    if (!window.indexedDB) throw new Error("indexedDB missing");
    await idb("readwrite", s => s.put(1, "__probe"));
    await idb("readonly", s => s.get("__probe"));
    backend = "idb"; return;
  } catch (e) { errs.push("IDB: " + (e && (e.name || "") + " " + (e.message || e))); }
  try {
    localStorage.setItem(LS_PREFIX + "__probe", "1");
    localStorage.removeItem(LS_PREFIX + "__probe");
    backend = "ls"; return;
  } catch (e) { errs.push("LS: " + (e && (e.name || "") + " " + (e.message || e))); }
  lastStorageError = errs.join(" | ");
  throw new Error(lastStorageError);
}
async function kvGet(k) {
  if (backend === "idb") return idb("readonly", s => s.get(k));
  return lsDecode(localStorage.getItem(LS_PREFIX + k));
}
async function kvSet(k, v) {
  if (backend === "idb") return idb("readwrite", s => s.put(v, k));
  localStorage.setItem(LS_PREFIX + k, lsEncode(v));
}
async function kvClear() {
  if (backend === "idb") return idb("readwrite", s => s.clear());
  Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k));
}

/* ========= הצפנה =========
   מפתח נתונים אקראי (AES-GCM 256) מצפין את כל הנתונים.
   עותקים "עטופים" של המפתח הזה נשמרים בכספת — כל עותק נפתח בדרך אחרת:
   קוד גישה (PBKDF2), Face ID (Passkey + PRF), או מפתח שחזור.
   מספיק אחד מהם כדי לפתוח. שום קוד לא נשמר. */
const ITERATIONS = 310000, RECOVERY_ITERATIONS = 100000;
const te = new TextEncoder(), td = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));

async function deriveKEK(secret, salt, iterations) {
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function prfKEK(prfOut) {
  const base = await crypto.subtle.importKey("raw", prfOut, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(32), info: te.encode("finance-tracker prf v1") },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const importDEK = raw => crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);

async function getVault() {
  const v = await kvGet("vault");
  if (!v) return null;
  if (v.wraps) return v;
  return { v: 2, wraps: [{ kind: "code", salt: v.salt, iterations: v.iterations, iv: v.iv, wrapped: v.wrapped }] };
}
const hasWrap = (vault, kind) => !!(vault && vault.wraps.find(w => w.kind === kind));
async function putWrap(entry) {
  const v = (await getVault()) || { v: 2, wraps: [] };
  v.wraps = v.wraps.filter(w => w.kind !== entry.kind).concat(entry);
  await kvSet("vault", v);
}
async function removeWrap(kind) {
  const v = await getVault(); if (!v) return;
  v.wraps = v.wraps.filter(w => w.kind !== kind);
  await kvSet("vault", v);
}
async function makeWrap(kind, kek, raw, extra) {
  const iv = rand(12);
  const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, kek, raw));
  return { kind, iv, wrapped, ...extra };
}
async function tryUnwrap(kek, w) {
  try { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: w.iv }, kek, w.wrapped)); }
  catch { return null; }
}
async function wrapAndStore(code, raw) {
  const salt = rand(16);
  await putWrap(await makeWrap("code", await deriveKEK(code, salt, ITERATIONS), raw, { salt, iterations: ITERATIONS }));
}
async function unwrapRaw(code) {
  const v = await getVault(); const w = v && v.wraps.find(x => x.kind === "code");
  return w ? tryUnwrap(await deriveKEK(code, w.salt, w.iterations), w) : null;
}
async function encryptJSON(obj) {
  const iv = rand(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, dek, te.encode(JSON.stringify(obj))));
  return { iv, ct };
}
async function decryptJSON(box) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: box.iv }, dek, box.ct);
  return JSON.parse(td.decode(pt));
}

/* ========= מפתח שחזור ========= */
const RK_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // בלי 0/O/1/I/L
function newRecoveryKey() {
  const bytes = rand(28);
  const chars = [...bytes].map(b => RK_ALPHABET[b % RK_ALPHABET.length]).join("");
  return chars.match(/.{4}/g).join("-");          // 7 קבוצות של 4 ≈ 138 ביט
}
async function storeRecovery(key, raw) {
  const salt = rand(16);
  await putWrap(await makeWrap("recovery", await deriveKEK(key, salt, RECOVERY_ITERATIONS), raw, { salt, iterations: RECOVERY_ITERATIONS }));
}
async function unwrapWithRecovery(input) {
  const v = await getVault(); const w = v && v.wraps.find(x => x.kind === "recovery");
  if (!w) return null;
  const cleaned = input.toUpperCase().replace(/[^A-Z0-9]/g, "").match(/.{1,4}/g)?.join("-") || "";
  return tryUnwrap(await deriveKEK(cleaned, w.salt, w.iterations), w);
}

/* ========= Face ID (Passkey עם הרחבת PRF) ========= */
async function faceIdAvailable() {
  try {
    return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
      && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  } catch { return false; }
}
async function prfEvaluate(credId, prfSalt) {
  const a = await navigator.credentials.get({ publicKey: {
    challenge: rand(32), rpId: location.hostname, timeout: 60000, userVerification: "required",
    allowCredentials: [{ type: "public-key", id: credId }],
    extensions: { prf: { eval: { first: prfSalt } } }
  }});
  const r = a && a.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error("no-prf");
  return new Uint8Array(r.results.first);
}
async function enableFaceId(raw) {
  const prfSalt = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: "מעקב הוצאות", id: location.hostname },
    user: { id: rand(16), name: "מעקב הוצאות", displayName: "מעקב הוצאות" },
    challenge: rand(32), timeout: 60000,
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "required", userVerification: "required" },
    extensions: { prf: { eval: { first: prfSalt } } }
  }});
  const credId = new Uint8Array(cred.rawId);
  const ext = cred.getClientExtensionResults().prf;
  if (ext && ext.enabled === false) throw new Error("no-prf");
  let out = ext && ext.results && ext.results.first ? new Uint8Array(ext.results.first) : null;
  if (!out) out = await prfEvaluate(credId, prfSalt);    // Safari מחזיר את התוצאה רק בכניסה
  await putWrap(await makeWrap("prf", await prfKEK(out), raw, { credId, prfSalt }));
}
async function unwrapWithFaceId() {
  const v = await getVault(); const w = v && v.wraps.find(x => x.kind === "prf");
  if (!w) return null;
  const out = await prfEvaluate(w.credId, w.prfSalt);
  return tryUnwrap(await prfKEK(out), w);
}

/* ========= קוד גישה: חוזק והשהיות ========= */
const CODE_LEN = 6, ATTEMPTS_BEFORE_DELAY = 5;
function isTooSimple(code) {
  const d = [...code].map(Number);
  if (new Set(d).size === 1) return true;
  const steps = new Set(d.slice(1).map((x, i) => x - d[i]));
  return steps.size === 1 && (steps.has(1) || steps.has(-1));
}
function delayFor(failures) {
  if (failures < 5) return 0;
  return ({ 5: 30, 6: 60, 7: 300, 8: 900 }[failures] ?? 3600) * 1000;
}
async function getGuard() { return (await kvGet("guard")) || { failed: 0, lockedUntil: 0 }; }
const setGuard = g => kvSet("guard", g);

/* ========= מצב האפליקציה ========= */
let dek = null;            // מפתח הנתונים — קיים בזיכרון רק כשהאפליקציה פתוחה
let settings = null;
let data = null;
let hiddenAt = null;
let state = "loading";     // setup | locked | unlocked
const AUTO_LOCK = [
  { s: 0, label: "מיידית" }, { s: 30, label: "30 שניות" },
  { s: 60, label: "דקה" }, { s: 300, label: "5 דקות" }
];
const app = document.getElementById("app");
const cover = document.getElementById("cover");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const screen = (inner, cls = "") => { app.innerHTML = `<section class="screen ${cls}">${inner}</section>`; window.scrollTo(0, 0); };
const topbar = (title, backLabel = "חזרה", backId = "back") =>
  `<div class="topbar"><h1>${esc(title)}</h1><button class="btn link" id="${backId}" type="button">${esc(backLabel)}</button></div>`;

async function saveSettings() { await kvSet("settings", await encryptJSON(settings)); }

function lock() {
  closeSheets();
  dek = null; settings = null; data = null; hiddenAt = null;
  state = "locked";
  renderLock();
}

async function finishUnlock(raw) {
  dek = await importDEK(raw); raw.fill(0);
  await setGuard({ failed: 0, lockedUntil: 0 });
  try { settings = await decryptJSON(await kvGet("settings")); } catch { settings = { autoLock: 30 }; }
  try { await loadData(); } catch { data = emptyData(); toast("לא הצלחתי לקרוא את הנתונים השמורים"); }
  state = "unlocked";
  renderHome();
}

/* ========= רכיב מקלדת קוד ========= */
function mountPad(host, { title, message = "", error = false, onComplete, extraKey = null }) {
  host.innerHTML = `
    <div class="pad-wrap">
      <div class="pad-title">${esc(title)}</div>
      <div class="pad-msg ${error ? "error" : ""}" aria-live="polite"></div>
      <div class="dots" role="img" aria-label="הוזנו 0 מתוך ${CODE_LEN} ספרות">
        ${"<span class='dot'></span>".repeat(CODE_LEN)}
      </div>
      <div class="keys">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-d="${n}" type="button">${n}</button>`).join("")}
        ${extraKey ? `<button class="key plain" data-x type="button">${esc(extraKey.label)}</button>` : `<span class="key hidden"></span>`}
        <button class="key" data-d="0" type="button">0</button>
        <button class="key plain hidden" data-del type="button" aria-label="מחיקה">מחיקה</button>
      </div>
    </div>`;
  const wrap = host.querySelector(".pad-wrap");
  const msgEl = host.querySelector(".pad-msg");
  const dotsEl = host.querySelector(".dots");
  const dots = [...host.querySelectorAll(".dot")];
  const del = host.querySelector("[data-del]");
  msgEl.textContent = message;
  let code = "", busy = false;

  const paint = () => {
    dots.forEach((d, i) => d.classList.toggle("on", i < code.length));
    dotsEl.setAttribute("aria-label", `הוזנו ${code.length} מתוך ${CODE_LEN} ספרות`);
    del.classList.toggle("hidden", code.length === 0);
  };
  const ctl = {
    setMessage(text, isError = false) { msgEl.textContent = text; msgEl.classList.toggle("error", isError); },
    shake() {

}

function installmentPlans() {
  const groups = new Map();
  for (const t of data.tx) {
    if (t.source === "bank" || !t.installment || t.installment.of < 2) continue;
    if (catTop(t.category) && catTop(t.category).id === "home_fixed") continue;   // בר מים וכו' = חשבון קבוע
    const k = [t.merchant, t.date, t.amount, t.installment.of].join("|");
    const st = data.statements.find(s => s.id === t.statementId);
    const g = groups.get(k) || { merchant: t.merchant, date: t.date, amount: t.amount, of: t.installment.of, seen: [], category: t.category };
    g.seen.push({ n: t.installment.n, charge: t.charge, chargeDate: st ? st.chargeDate : null, tx: t });
    if (t.catSource === "user" || !g.category) g.category = t.category;
    groups.set(k, g);
  }
  const lastCycle = cycleDates().slice(-1)[0];
  const cancelled = new Set(data.tx.filter(t => t.source !== "bank" && /ביטול/.test(t.typeRaw || "")).map(t => t.merchant));
  return [...groups.values()].map(g => {
    g.seen.sort((a, b) => a.n - b.n);
    const latest = g.seen[g.seen.length - 1];
    const monthly = latest.charge != null && latest.charge > 0 ? latest.charge : g.amount / g.of;
    const remaining = Math.max(0, g.of - latest.n);
    const paidSum = g.seen.reduce((a, s) => a + (s.charge || 0), 0);
    const endCharge = latest.chargeDate ? addMonths(latest.chargeDate, remaining) : null;
    const isCancelled = cancelled.has(g.merchant);
    return { ...g, latest, monthly, remaining, paidN: latest.n, paidSum, cancelled: isCancelled,
      remainingAmount: isCancelled ? 0 : Math.max(0, round2(g.amount - paidSum)), endCharge, active: remaining > 0 && !isCancelled,
      stale: remaining > 0 && !isCancelled && latest.chargeDate !== lastCycle };
  }).sort((a, b) => (b.active - a.active) || b.date.localeCompare(a.date));
}

/* ========= קריאת קובצי Excel — במכשיר, בלי ספריות חיצוניות ========= */
async function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td8 = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("not-zip");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("bad-zip");
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    files[td8.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, lho };
    p += 46 + nlen + elen + clen;
  }
  return {
    names: () => Object.keys(files),
    async text(name) {
      const f = files[name]; if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      if (f.method === 0) return td8.decode(raw);
      if (f.method !== 8) throw new Error("zip-method");
      if (typeof DecompressionStream === "undefined") throw new Error("no-decompress");
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return td8.decode(new Uint8Array(await new Response(stream).arrayBuffer()));
    }
  };
}

async function readSheet(buf) {
  const z = await unzip(buf);
  const xml = t => new DOMParser().parseFromString(t, "application/xml");
  const ss = [];
  const sst = await z.text("xl/sharedStrings.xml");
  if (sst) for (const si of xml(sst).getElementsByTagName("si")) ss.push([...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  const fmts = {}, xfs = [];
  const st = await z.text("xl/styles.xml");
  if (st) {
    const d = xml(st);
    for (const f of d.getElementsByTagName("numFmt")) fmts[f.getAttribute("numFmtId")] = f.getAttribute("formatCode");
    const cx = d.getElementsByTagName("cellXfs")[0];
    if (cx) for (const x of cx.getElementsByTagName("xf")) xfs.push(fmts[x.getAttribute("numFmtId")] || "");
  }
  const names = z.names();
  const sheet = names.includes("xl/worksheets/sheet1.xml") ? "xl/worksheets/sheet1.xml" : names.find(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n));
  if (!sheet) throw new Error("no-sheet");
  const doc = xml(await z.text(sheet));
  const rows = [];
  for (const r of doc.getElementsByTagName("row")) {
    const row = [];
    for (const c of r.getElementsByTagName("c")) {
      const letters = (c.getAttribute("r") || "").replace(/\d+/g, "");
      const col = [...letters].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      if (col < 0) continue;
      const t = c.getAttribute("t");
      const vEl = c.getElementsByTagName("v")[0];
      let v = vEl ? vEl.textContent : null;
      if (t === "s" && v != null) v = ss[Number(v)];
      else if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else if (v != null && t !== "str" && t !== "e" && t !== "b") v = Number(v);
      row[col] = { v, fmt: xfs[Number(c.getAttribute("s") || 0)] || "" };
    }
    rows.push(row);
  }
  return rows;
}

const round2 = n => Math.round(n * 100) / 100;
const parseNum = s => Number(String(s).replace(/[,\s₪]/g, ""));
const serialToISO = n => new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
function currencyOf(fmt) {
  if (/\[\$\$\]/.test(fmt)) return "USD";
  if (/\[\$€/.test(fmt)) return "EUR";
  if (/\[\$£/.test(fmt)) return "GBP";
  return "ILS";
}
function normType(raw, charge) {
  if (raw.includes("ביטול") || (charge != null && charge < 0)) return "refund";
  if (raw.includes("תשלומים")) return "installments";
  if (raw.includes("הוראת קבע")) return "standing";
  if (raw.includes("מזומן")) return "cash";
  if (raw.includes("קרדיט")) return "credit";
  if (raw.includes("רגילה")) return "regular";
  return "other";
}

/* פענוח קובץ ייצוא של כאל. נשמרים רק: 4 ספרות אחרונות, סוג הכרטיס, מועד חיוב, סכומים ופרטי העסקאות.
   שורת הכותרת (עם מספר החשבון) ושם הגיליון לא נשמרים בשום מקום. */
function parseCal(rows) {
  const textAt = i => rows[i] && rows[i][0] && typeof rows[i][0].v === "string" ? rows[i][0].v : "";
  let last4 = null, product = "", chargeDate = null, total = null, immediateTotal = 0, pendingTotal = 0, headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const t = textAt(i);
    let m;
    if ((m = t.match(/המסתיים ב-?\s*(\d{4})/))) {
      last4 = m[1];
      const pm = t.match(/לכרטיס\s+(.+?)\s+המסתיים/);
      if (pm) product = pm[1].slice(0, 40);
    }
    if ((m = t.match(/לחיוב ב-?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*:?\s*(-?[\d,.]+)/))) {
      chargeDate = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      total = parseNum(m[4]);
    }
    if ((m = t.match(/בחיוב מיידי\s*(-?[\d,.]+)/))) immediateTotal = parseNum(m[1]);
    if ((m = t.match(/בתהליך קליטה\s*(-?[\d,.]+)/))) pendingTotal = parseNum(m[1]);
    if (t.startsWith("תאריך")) { headerIdx = i; break; }
  }
  if (headerIdx < 0 || !chargeDate || !last4) throw new Error("not-cal");

  const tx = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[0] || typeof r[0].v !== "number") continue;
    const cell = k => (r[k] && r[k].v != null && r[k].v !== "") ? r[k].v : null;
    const notes = String(cell(6) || "").trim();
    const typeRaw = String(cell(4) || "").trim();
    const inst = notes.match(/תשלום\s+(\d+)\s+מתוך\s+(\d+)/);
    const charge = cell(3) == null ? null : Number(cell(3));
    tx.push({
      date: serialToISO(r[0].v),
      merchant: String(cell(1) || "").trim(),
      amount: Number(cell(2)) || 0,
      currency: currencyOf(r[2] ? r[2].fmt : ""),
      charge, typeRaw, type: normType(typeRaw, charge),
      branch: cell(5) ? String(cell(5)).trim() : "",
      notes,
      installment: inst ? { n: +inst[1], of: +inst[2] } : null,
      pending: notes.includes("בקליטה"),
      immediate: notes.includes("חיוב מיידי")
    });
  }
  const sumCharge = round2(tx.filter(t => !t.pending && !t.immediate).reduce((a, t) => a + (t.charge || 0), 0));
  return { last4, product, chargeDate, total, immediateTotal, pendingTotal, tx, sumCharge,
    verified: total != null && Math.abs(sumCharge - total) < 0.01 };
}

let txCat = null;          // סינון לפי קטגוריה ראשית ("none" = ממתין לסיווג)
let txSearch = "";

function goTab(id) { ({ home: renderHome, tx: renderTx, fixed: renderFixed, money: renderFinance, settings: renderSettings }[id] || renderHome)(); }

function tabScreen(tab, inner) {
  currentTab = tab;
  closeSheets();
  screen(inner, "has-tabs");
  const q = data ? reviewQueue().length : 0;
  app.insertAdjacentHTML("beforeend", `
    <nav class="tabbar" aria-label="ניווט ראשי">
      ${TABS.map(([id, label, icon]) => `
        <button type="button" data-tab="${id}" ${id === tab ? 'aria-current="page"' : ""}>
          <span class="tab-ic">${icon}${id === "tx" && q ? `<span class="tab-badge">${q > 99 ? "99+" : q}</span>` : ""}</span>
          <span>${label}</span>
        </button>`).join("")}
    </nav>`);
  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.tab === currentTab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    goTab(b.dataset.tab);
  }));
}

function closeSheets() { document.querySelectorAll(".sheet-wrap").forEach(e => e.remove()); }
function openSheet(title, body, mount) {
  closeSheets();
  const el = document.createElement("div");
  el.className = "sheet-wrap";
  el.innerHTML = `
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head"><h2>${esc(title)}</h2><button class="btn link" type="button" data-close>סגירה</button></div>
      <div class="sheet-body">${body}</div>
    </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("open")));
  const close = () => { el.classList.remove("open"); setTimeout(() => el.remove(), 260); };
  el.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  if (mount) mount(el, close);
  return close;
}

/* בחירת חודש: כפתור קטן שפותח רשימה */
function monthPill(st, cls = "") {
  return `<button class="month-pill ${cls}" id="pickMonth" type="button" aria-label="בחירת חודש">
    <span>${esc(cycleLabel(st.chargeDate))}</span>${ICON_CHEV}</button>`;
}
function bindMonthPill(rerender) {
  const b = document.getElementById("pickMonth"); if (!b) return;
  b.addEventListener("click", () => {
    const sts = statementsSorted();
    openSheet("בחירת חודש", `
      <div class="group">
        ${sts.map(s => {
          const sum = txInCycle(s.chargeDate).reduce((a, t) => a + spent(t), 0);
          return `<button class="row pick" type="button" data-st="${s.id}" aria-pressed="${s.id === selectedStatementId}">
            <span class="bill-main"><b>${esc(cycleLabel(s.chargeDate))}</b><small>${isOpen(s) ? "מחזור פתוח · לחיוב ב-" : "חויב ב-"}${ddmm(s.chargeDate)}</small></span>
            <span class="bill-amt"><b>${fmtMoney(sum)}</b></span>
          </button>`;
        }).join("")}
      </div>`, (el, close) => {
      el.querySelectorAll("[data-st]").forEach(x => x.addEventListener("click", () => { selectedStatementId = x.dataset.st; close(); rerender(); }));
    });
  });
}
function currentStatement() {
  const sts = statementsSorted();
  if (!sts.find(s => s.id === selectedStatementId)) selectedStatementId = sts[0] ? sts[0].id : null;
  return sts.find(s => s.id === selectedStatementId) || null;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "לילה טוב" : h < 12 ? "בוקר טוב" : h < 17 ? "צהריים טובים" : h < 21 ? "ערב טוב" : "לילה טוב";
}

function homeWithData(st) {
  const card = data.cards.find(c => c.id === st.cardId);
  const tx = txInCycle(st.chargeDate);
  const open = isOpen(st);
  const total = tx.reduce((a, t) => a + spent(t), 0);
  const byCat = cats().map(c => ({ id: c.id, label: c.short, color: c.color, sum: tx.filter(t => catTop(t.category) === c).reduce((a, t) => a + spent(t), 0) }));
  const unc = tx.filter(t => !t.category).reduce((a, t) => a + spent(t), 0);
  if (unc) byCat.push({ id: "none", label: "ממתין לסיווג", color: "var(--muted)", sum: unc });
  const ranked = byCat.filter(x => x.sum > 0).sort((a, b) => b.sum - a.sum);
  const shown = homeAllCats ? ranked : ranked.slice(0, 3);
  const queue = reviewQueue().length;
  const m = moneyPicture();
  const hasMoney = m.bank != null || m.portfolio != null || m.walletSum > 0;

  return `
    <article class="hero">
      <div class="hero-top">

      <div class="hero-label">סך ההוצאות</div>
      <div class="hero-num">${fmtMoney(total)}</div>
      <div class="hero-sub">
        ${esc(card ? card.nickname : "כרטיס")} · ${fmtMoney(st.total)} · ${open ? "לחיוב ב-" : "חויב ב-"}${ddmm(st.chargeDate)}
        ${st.verified ? "" : ` · <span class="hero-warn">לא תואם לקובץ</span>`}
      </div>
    </article>

    ${queue ? `<button class="review-bar" id="openReview" type="button"><span class="count">${queue}</span><span>עסקאות ממתינות לסיווג</span><span aria-hidden="true">‹</span></button>` : ""}

    ${ranked.length ? `
    <section class="panel">
      <div class="panel-head"><h3>לאן הלך הכסף</h3></div>
      <div class="stackbar" role="img" aria-label="חלוקת ההוצאות לפי קטגוריה">
        ${ranked.map(x => `<span style="flex:${x.sum};background:${x.color}"></span>`).join("")}
      </div>

    ${hasMoney ? `

}

/* ========= עסקאות: חיפוש וסינון ========= */
const TYPE_FILTERS = [["all", "הכול"], ["bank", "עו\"ש"], ["installments", "תשלומים"], ["standing", "הוראות קבע"], ["review", "לבדיקה"], ["special", "מיוחדות"]];
function txMatches(t) {
  const typeOk =
    txFilter === "all" ? true :
    txFilter === "bank" ? t.source === "bank" :
    txFilter === "installments" ? !!t.installment :
    txFilter === "standing" ? t.type === "standing" :
    txFilter === "review" ? inQueue(t) :
    (t.immediate || t.pending || t.type === "refund" || t.type === "credit" || t.currency !== "ILS");
  if (!typeOk) return false;
  if (txCat) {
    if (txCat === "none") { if (t.category || !(spent(t) > 0)) return false; }
    else if (!catTop(t.category) || catTop(t.category).id !== txCat) return false;
  }
  if (txSearch) {
    const q = txSearch.toLowerCase();
    if (!(`${t.merchant} ${t.note || ""}`.toLowerCase().includes(q))) return false;
  }
  return true;
}

function renderTx() {
  returnTo = () => renderTx();
  const st = currentStatement();
  if (!st) {
    tabScreen("tx", `<header class="pagehead"><h1>עסקאות</h1></header>
      <p class="footnote">עוד אין עסקאות. ייבא קבצים מהמסך הראשי.</p>`);
    return;
  }
  tabScreen("tx", `
    <header class="pagehead">
      <h1>עסקאות</h1>
      ${monthPill(st)}
    </header>
    <div class="searchrow">
      <label class="search">
        ${ICON_SEARCH}
        <input id="q" type="search" placeholder="חיפוש בית עסק או הערה" value="${esc(txSearch)}" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="icon-btn filter-btn" id="openFilter" type="button" aria-label="סינון">${ICON_FILTER}<span class="tab-badge" id="fcount" hidden></span></button>
    </div>
    <div class="chips" id="activeChips"></div>
    <div class="tx-summary" id="txSum"></div>
    <div class="txlist" id="txList"></div>`);
  bindMonthPill(renderTx);
  const q = document.getElementById("q");
  q.addEventListener("input", () => { txSearch = q.value.trim(); drawTxList(); });
  document.getElementById("openFilter").addEventListener("click", openFilterSheet);
  drawTxList();
}

function drawTxList() {
  const st = currentStatement(); if (!st) return;
  const all = txInCycle(st.chargeDate);
  const shown = all.filter(txMatches);

  const chips = [];
  if (txFilter !== "all") chips.push(["type", TYPE_FILTERS.find(f => f[0] === txFilter)[1]]);
  if (txCat) chips.push(["cat", txCat === "none" ? "ממתין לסיווג" : (cats().find(c => c.id === txCat) || {}).short || "קטגוריה"]);
  const chipsEl = document.getElementById("activeChips");
  chipsEl.innerHTML = chips.map(([k, l]) => `<button type="button" class="chip-x" data-clear="${k}">${esc(l)} <span aria-hidden="true">×</span><span class="sr">הסרת סינון</span></button>`).join("");
  chipsEl.hidden = !chips.length;
  chipsEl.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.clear === "type") txFilter = "all"; else txCat = null; drawTxList();
  }));
  const fc = document.getElementById("fcount");
  fc.hidden = !chips.length; fc.textContent = chips.length;

  const sum = shown.reduce((a, t) => a + spent(t), 0);
  const bankTx = shown.filter(t => t.source === "bank");
  const income = bankTx.filter(t => t.kind === "income").reduce((a, t) => a + t.signed, 0);
  document.getElementById("txSum").innerHTML = `
    <span>${shown.length} תנועות</span><span class="dotsep"></span><span>הוצאות <b>${fmtMoney(sum)}</b></span>
    ${income ? `<span class="dotsep"></span><span>הכנסות <b class="pos">${fmtMoney(income)}</b></span>` : ""}`;

  const groups = {};
  shown.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const days = Object.keys(groups).sort().reverse();
  const list = document.getElementById("txList");
  list.innerHTML = days.length ? days.map(d => `
    <div class="day">${new Date(d + "T12:00:00").toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric" })}</div>
    <div class="group">${groups[d].map(txRow).join("")}</div>`).join("")
    : `<div class="emptystate"><p>אין תנועות שמתאימות לסינון.</p>${chips.length || txSearch ? `<button class="btn link" id="clearAll" type="button">ניקוי סינון</button>` : ""}</div>`;
  list.querySelectorAll("[data-tx]").forEach(b => b.addEventListener("click", () => renderCategorize(b.dataset.tx)));
  const ca = document.getElementById("clearAll");
  if (ca) ca.addEventListener("click", () => { txFilter = "all"; txCat = null; txSearch = ""; renderTx(); });
}

function openFilterSheet() {
  const st = currentStatement();
  const tx = st ? txInCycle(st.chargeDate) : [];
  const catOpts = cats().map(c => ({ id: c.id, label: c.short, color: c.color, n: tx.filter(t => catTop(t.category) === c && spent(t) > 0).length }));
  const nUnc = tx.filter(t => !t.category && spent(t) > 0).length;
  openSheet("סינון", `
    <div class="section-label">סוג</div>
    <div class="optgrid">
      ${TYPE_FILTERS.map(([k, l]) => `<button type="button" class="opt" data-type="${k}" aria-pressed="${k === txFilter}">${l}</button>`).join("")}
    </div>
    <div class="section-label">קטגוריה</div>
    <div class="group">
      <button class="row pick" type="button" data-fcat="" aria-pressed="${!txCat}"><span>כל הקטגוריות</span></button>
      ${catOpts.map(c => `<button class="row pick" type="button" data-fcat="${c.id}" aria-pressed="${txCat === c.id}">
        <span class="catname"><i style="background:${c.color}"></i>${esc(c.label)}</span><span class="val">${c.n}</span></button>`).join("")}
      ${nUnc ? `<button class="row pick" type="button" data-fcat="none" aria-pressed="${txCat === "none"}"><span class="catname"><i style="background:var(--muted)"></i>ממתין לסיווג</span><span class="val">${nUnc}</span></button>` : ""}
    </div>
    <div class="sheet-actions">
      <button class="btn secondary" type="button" id="fReset">איפוס</button>
      <button class="btn" type="button" data-close>הצגת תוצאות</button>
    </div>`, (el, close) => {
    const sync = () => {
      el.querySelectorAll("[data-type]").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === txFilter));
      el.querySelectorAll("[data-fcat]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.fcat || null) === txCat));
      drawTxList();
    };
    el.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { txFilter = b.dataset.type; sync(); }));
    el.querySelectorAll("[data-fcat]").forEach(b => b.addEventListener("click", () => { txCat = b.dataset.fcat || null; sync(); }));
    el.querySelector("#fReset").addEventListener("click", () => { txFilter = "all"; txCat = null; sync(); });
  });
}

function txRow(t) {
  const chips = [];
  if (t.source === "bank") chips.push(`<span class="pill bank">עו"ש</span>`);
  if (t.installment) chips.push(`<span class="pill">${t.installment.n === 0 ? "קרדיט" : "תשלום " + t.installment.n + "/" + t.installment.of}</span>`);
  if (t.type === "standing") chips.push(`<span class="pill">הוראת קבע</span>`);
  if (t.immediate) chips.push(`<span class="pill warn">חיוב מיידי</span>`);
  if (t.pending) chips.push(`<span class="pill warn">בקליטה</span>`);
  if (t.type === "refund") chips.push(`<span class="pill ok">זיכוי</span>`);
  if (t.type === "cash") chips.push(`<span class="pill">מזומן</span>`);

  let catChip;
  if (t.source === "bank" && t.kind !== "expense") {
    catChip = `<span class="catchip">${t.kind === "card_payment" ? `חיוב כרטיס${t.matched ? " ✓" : ""}` : t.kind === "investment" ? "ניירות ערך" : /משכורת/.test(t.merchant) ? "משכורת" : "הכנסה"}</span>`;
  } else {
    const c = catTop(t.category);
    catChip = !t.category ? `<span class="pill warn">ממתין לסיווג</span>`
      : `<span class="catchip"><i style="background:${c.color}"></i>${esc(catLabel(t.category))}${t.needsReview ? " ?" : ""}</span>`;
  }

  let main, sub = "";
  if (t.source === "bank") {
    main = t.signed > 0 ? `<span class="pos">+${fmtMoney(t.signed)}</span>` : fmtMoney(-t.signed);
  } else if (t.pending || t.charge == null) {
    main = `<span class="muted">${fmtMoney(t.amount, t.currency)}</span>`;
    sub = t.pending ? "" : "יחויב בהמשך";
  } else {
    main = fmtMoney(t.charge);
    if (t.currency !== "ILS") sub = `במקור ${fmtMoney(t.amount, t.currency)}`;
    else if (t.installment && t.installment.n > 0 && Math.abs(t.amount - t.charge) > 0.009) sub = `מתוך ${fmtMoney(t.amount)}`;
  }
  return `
    <button class="tx" type="button" data-tx="${t.id}">
      <span class="tx-main">
        <span class="tx-name">${esc(t.merchant)}</span>
        <span class="tx-sub">${catChip} ${chips.join(" ")}</span>
        ${t.note ? `<span class="tx-note">${esc(t.note)}</span>` : ""}
      </span>
      <span class="tx-amt">${main}${sub ? `<small>${sub}</small>` : ""}</span>
    </button>`;
}

/* ========= סיווג עסקה + הערה ========= */
function renderCategorize(txId, fromReview = false) {
  const t = data.tx.find(x => x.id === txId); if (!t) return returnTo();
  const key = normMerchant(t.merchant);
  const sameCount = data.tx.filter(x => normMerchant(x.merchant) === key).length;
  const nonExpense = t.source === "bank" && t.kind !== "expense";
  const amountText = t.source === "bank" ? (t.signed > 0 ? "+" + fmtMoney(t.signed) : fmtMoney(-t.signed))
    : t.charge != null ? fmtMoney(t.charge) : fmtMoney(t.amount, t.currency);
  screen(`
    ${topbar(nonExpense ? "פרטי תנועה" : "סיווג", "חזרה")}
    <article class="card col">
      <h3>${esc(t.merchant)}</h3>
      <p>${new Date(t.date + "T12:00:00").toLocaleDateString("he-IL")} · ${amountText}
        ${t.source === "bank" ? " · עו\"ש" : ""}${t.branch ? " · ענף בכאל: " + esc(t.branch) : ""}${t.installment ? ` · תשלום ${t.installment.n}/${t.installment.of}` : ""}${t.type === "cash" ? " · משיכת מזומן" : ""}</p>
      ${t.needsReview && t.category ? `<p class="note">הצעה: <b>${esc(catLabel(t.category, true))}</b>. אשר או בחר אחרת.</p>` : ""}
      ${nonExpense ? `<p class="note">${t.kind === "card_payment" ? "חיוב של כרטיס האשראי. העסקאות עצמן כבר מופיעות מקובץ כאל, ולכן זה לא נספר כהוצאה." : t.kind === "investment" ? "תנועה בתיק ניירות הערך. לא נספרת כהוצאה או כהכנסה." : "הכנסה."}</p>` : ""}
      <label for="note" class="note">הערה (למשל סיבת העברה בביט)</label>
      <input class="field" id="note" type="text" maxlength="80" value="${esc(t.note || "")}" placeholder="אופציונלי">
    </article>
    ${nonExpense ? `<button class="btn" id="saveNote" type="button">שמירה</button>` : `
    ${sameCount > 1 || !isTransferLike(t) ? `
    <label class="check">
      <input type="checkbox" id="applyAll" ${isTransferLike(t) ? "" : "checked"}>
      <span>להחיל על כל העסקאות מ"${esc(t.merchant.replace(/\*.*$/, ""))}"${sameCount > 1 ? ` (${sameCount})` : ""}, גם בייבוא הבא</span>
    </label>` : ""}
    <div class="stack">
      ${cats().map(c => `
        <div class="group">
          <div class="row head"><span class="catname"><i style="background:${c.color}"></i>${esc(c.name)}</span></div>
          <div class="subgrid">
            ${c.subs.map(([sid, sl]) => {
              const k = `${c.id}/${sid}`;
              return `<button type="button" class="subbtn" data-cat="${k}" aria-pressed="${t.category === k}">${esc(sl)}</button>`;
            }).join("")}
          </div>
        </div>`).join("")}
    </div>`}`);
  const noteEl = document.getElementById("note");
  const saveNote = async () => { const v = noteEl.value.trim(); if ((t.note || "") !== v) { t.note = v; await saveData(); } };
  document.getElementById("back").addEventListener("click", async () => { await saveNote(); fromReview ? renderReview() : returnTo(); });
  const sn = document.getElementById("saveNote");
  if (sn) sn.addEventListener("click", async () => { await saveNote(); toast("נשמר"); fromReview ? renderReview() : returnTo(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", async () => {
    const cat = b.dataset.cat;
    const all = document.getElementById("applyAll");
    if (all && all.checked) {
      data.rules.merchant[key] = cat;
      data.tx.filter(x => normMerchant(x.merchant) === key && x.catSource !== "user")
        .forEach(x => { x.category = cat; x.catSource = "auto"; x.needsReview = false; });
    }
    t.category = cat; t.catSource = "user"; t.needsReview = false;
    t.note = noteEl.value.trim();
    await saveData();
    toast("סווג: " + catLabel(cat, true));
    fromReview ? renderReview() : returnTo();
  }));
}

/* ========= ייבוא: כאל + דיסקונט ========= */
function renderImport() {
  let parsed = [];
  screen(`
    ${topbar("ייבוא קבצים", "ביטול", "cancel")}
    <p class="lead" style="max-width:none">כאל: "ייצוא לאקסל" לכל חודש. דיסקונט: ייצוא תנועות בעו"ש. אפשר לבחור כמה קבצים יחד. הכול נקרא כאן במכשיר. מספרי חשבון וצ'קים לא נשמרים, ושום דבר לא נשלח החוצה.</p>
    <label class="btn secondary" for="file">בחירת קבצים</label>
    <input id="file" type="file" accept=".xlsx,.csv,.tsv,.txt,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
    <div id="preview" class="stack"></div>
    <button class="btn" id="save" type="button" hidden>שמירה</button>`);
  document.getElementById("cancel").addEventListener("click", () => goTab(currentTab));
  const input = document.getElementById("file"), preview = document.getElementById("preview"), saveBtn = document.getElementById("save");

  input.addEventListener("change", async () => {
    const files = [...input.files];
    input.value = "";
    if (!files.length) return;
    preview.innerHTML = `<p class="footnote">קורא ${files.length} קבצים…</p>`;
    parsed = [];
    for (const f of files) {
      try {
        const isXlsx = /\.xlsx$/i.test(f.name) || (await f.slice(0, 2).text()) === "PK";
        if (isXlsx) {
          const rows = await readSheet(await f.arrayBuffer());
          try { parsed.push({ name: f.name, ok: true, kind: "cal", res: parseCal(rows) }); }
          catch { parsed.push({ name: f.name, ok: true, kind: "bank", res: parseDiscount(rows.map(r => (r || []).map(c => c ? c.v : null))) }); }
        } else {
          parsed.push({ name: f.name, ok: true, kind: "bank", res: parseDiscount(parseDelimited(await readTextFile(f))) });
        }
      } catch (e) {
        const msg = e.message === "no-decompress" ? "הדפדפן ישן מדי לקריאת קובצי אקסל. עדכן את iOS."
          : (e.message === "not-cal" || e.message === "not-bank") ? "הקובץ לא נראה כמו ייצוא של כאל או של דיסקונט." : "לא הצלחתי לקרוא את הקובץ.";
        parsed.push({ name: f.name, ok: false, err: msg });
      }
    }
    const seen = new Map();
    parsed.filter(p => p.ok && p.kind === "cal").forEach(p => seen.set(p.res.last4 + p.res.chargeDate, p));
    parsed = parsed.filter(p => !p.ok || p.kind !== "cal" || seen.get(p.res.last4 + p.res.chargeDate) === p);
    parsed.sort((a, b) => (a.kind === "bank") - (b.kind === "bank") || ((b.ok && b.kind === "cal" ? b.res.chargeDate : "").localeCompare(a.ok && a.kind === "cal" ? a.res.chargeDate : "")));
    drawPreview();
  });

  function drawPreview() {
    const existingFp = new Set(data.tx.filter(t => t.source === "bank").map(bankFp));
    const newCards = [...new Set(parsed.filter(p => p.ok && p.kind === "cal").map(p => p.res.last4))].filter(l4 => !data.cards.find(c => c.last4 === l4));
    preview.innerHTML = `
      ${newCards.map(l4 => {
        const prod = (parsed.find(p => p.ok && p.kind === "cal" && p.res.last4 === l4) || {}).res.product || "";
        return `
        <div class="card col">
          <h3>כרטיס חדש</h3>
          <p>${esc(prod ? "כאל · " + prod : "כאל")}. איך לקרוא לו? אפשר לשנות בכל זמן בהגדרות.</p>
          <input class="field" id="nick-${l4}" type="text" maxlength="30" value="הכרטיס שלי" aria-label="שם לכרטיס">
        </div>`;
      }).join("")}
      ${parsed.map(p => !p.ok ? `
        <div class="card"><div class="chip" aria-hidden="true">✕</div><div><h3>${esc(p.name)}</h3><p class="err">${esc(p.err)}</p></div></div>`
      : p.kind === "cal" ? `
        <div class="card">
          <div class="chip ${p.res.verified ? "ok" : ""}" aria-hidden="true">${p.res.verified ? "✓" : "!"}</div>
          <div>
            <h3>כאל · ${esc(cycleLabel(p.res.chargeDate))} · חיוב ${ddmm(p.res.chargeDate)}</h3>
            <p>${p.res.tx.length} עסקאות · ${fmtMoney(p.res.total)}
              ${p.res.verified ? " · תואם לסכום בקובץ" : ` · <span class="err">הסכום לא תואם (${fmtMoney(p.res.sumCharge)})</span>`}
              ${p.res.chargeDate > todayISO() ? " · מחזור פתוח" : ""}
              ${data.statements.find(s => s.chargeDate === p.res.chargeDate && (data.cards.find(c => c.id === s.cardId) || {}).last4 === p.res.last4) ? " · יחליף ייבוא קודם" : ""}</p>
          </div>
        </div>` : `
        <div class="card">
          <div class="chip ok" aria-hidden="true">✓</div>
          <div>
            <h3>דיסקונט · עו"ש</h3>
            <p>${p.res.tx.length} תנועות (${p.res.tx.filter(t => !existingFp.has(bankFp(t))).length} חדשות) · ${ddmm(p.res.from)}–${ddmm(p.res.to)}
              ${p.res.latestBalance != null ? ` · יתרה ${fmtMoney(p.res.latestBalance)}` : ""}</p>
          </div>
        </div>`).join("")}`;
    saveBtn.hidden = !parsed.some(p => p.ok);
  }

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true; saveBtn.textContent = "מצפין ושומר…";
    let latest = null;
    for (const p of parsed.filter(x => x.ok && x.kind === "cal")) {
      const r = p.res;
      let card = data.cards.find(c => c.last4 === r.last4);
      if (!card) {
        const el = document.getElementById("nick-" + r.last4);
        card = { id: uid(), issuer: "cal", last4: r.last4, product: r.product, nickname: (el && el.value.trim()) || "הכרטיס שלי" };
        data.cards.push(card);
      }
      const old = data.statements.find(s => s.cardId === card.id && s.chargeDate === r.chargeDate);
      const keep = new Map();   // סיווגים ידניים והערות שורדים ייבוא חוזר של אותו מחזור
      if (old) {
        data.tx.filter(t => t.statementId === old.id && (t.catSource === "user" || t.note))
          .forEach(t => keep.set([t.date, t.merchant, t.amount, t.installment ? t.installment.n : ""].join("|"), { category: t.category, catSource: t.catSource, note: t.note }));
        data.tx = data.tx.filter(t => t.statementId !== old.id);
        data.statements = data.statements.filter(s => s !== old);
      }
      const stmt = { id: uid(), cardId: card.id, chargeDate: r.chargeDate, total: r.total,
        immediateTotal: r.immediateTotal, pendingTotal: r.pendingTotal, verified: r.verified, importedAt: new Date().toISOString() };
      data.statements.push(stmt);
      r.tx.forEach(t => {
        const nt = { ...t, id: uid(), source: "card", statementId: stmt.id, cardId: card.id, category: null, catSource: null, needsReview: false, note: "" };
        const k = [t.date, t.merchant, t.amount, t.installment ? t.installment.n : ""].join("|");
        const kept = keep.get(k);
        if (kept) { nt.note = kept.note || ""; if (kept.catSource === "user") { nt.category = kept.category; nt.catSource = "user"; } }
        if (nt.catSource !== "user") { const c = classify(nt); nt.category = c.cat; nt.catSource = c.cat ? "auto" : null; nt.needsReview = !c.sure; }
        data.tx.push(nt);
      });
      if (!latest || stmt.chargeDate > latest.chargeDate) latest = stmt;
    }
    for (const p of parsed.filter(x => x.ok && x.kind === "bank")) {
      const r = p.res;
      data.accounts = data.accounts || [];
      let acc = data.accounts[0];
      if (!acc) { acc = { id: uid(), bank: "discount", nickname: "עו\"ש ראשי", latestBalance: null, latestDate: null }; data.accounts.push(acc); }
      const existing = new Set(data.tx.filter(t => t.source === "bank").map(bankFp));
      r.tx.forEach(t => {
        if (existing.has(bankFp(t))) return;
        const kind = bankKind(t.desc, t.signed);
        const nt = { id: uid(), source: "bank", accountId: acc.id, date: t.date, valueDate: t.valueDate, merchant: t.desc, desc: t.desc,
          signed: t.signed, balance: t.balance, kind, charge: kind === "expense" ? -t.signed : t.signed, amount: Math.abs(t.signed),
          currency: "ILS", type: kind, branch: "", installment: null, pending: false, immediate: false,
          category: null, catSource: null, needsReview: false, note: "" };
        const c = classify(nt); nt.category = c.cat; nt.catSource = c.cat ? "auto" : null; nt.needsReview = !c.sure;
        data.tx.push(nt);
      });
      if (r.latestBalance != null && (!acc.latestDate || r.latestDate >= acc.latestDate)) { acc.latestBalance = r.latestBalance; acc.latestDate = r.latestDate; }
    }
    matchCardPayments();
    try {
      await saveData();
      if (latest) selectedStatementId = latest.id;
      txFilter = "all"; txCat = null; txSearch = "";
      renderHome();
      const q = reviewQueue().length;
      toast(q ? `הייבוא נשמר · ${q} ממתינות לסיווג` : "הייבוא נשמר");
    } catch {
      saveBtn.disabled = false; saveBtn.textContent = "שמירה";
      toast("השמירה נכשלה. נסה שוב");
    }
  });
}

/* חיוב כאל בבנק ← בודק שתואם לסכום של מחזור או לחיוב מיידי */
function matchCardPayments() {
  const amounts = [];
  data.statements.forEach(s => { amounts.push(s.total); });
  data.tx.filter(t => t.source !== "bank" && t.immediate && t.charge).forEach(t => amounts.push(t.charge));
  data.tx.filter(t => t.source === "bank" && t.kind === "card_payment")
    .forEach(t => { t.matched = amounts.some(a => Math.abs(a + t.signed) < 0.01); });
}

function billsBody() {
  const fixed = cats().find(c => c.id === "home_fixed");
  if (!fixed) return `<p class="footnote">הקטגוריה "חשבונות קבועים" נמחקה. אפשר להוסיף אותה מחדש בהגדרות ← קטגוריות.</p>`;
  const cur = currentStatement();
  const curTx = cur ? txInCycle(cur.chargeDate) : [];
  const infos = fixed.subs.map(([sid, label]) => ({ sid, label, ...billInfo(sid),
    actual: curTx.filter(t => t.category === `home_fixed/${sid}`).reduce((a, t) => a + spent(t), 0) }));
  const avgTotal = infos.reduce((a, b) => a + (b.monthly || 0), 0);
  const actualTotal = infos.reduce((a, b) => a + b.actual, 0);
  return `
    <article class="panel">
      <div class="duo">
        <div><small>ממוצע לחודש</small><b class="mid-num">${fmtMoney(avgTotal)}</b></div>
        <div><small>בפועל ב${cur ? esc(cycleLabel(cur.chargeDate)) : "חודש"}</small><b class="mid-num">${fmtMoney(actualTotal)}</b></div>
      </div>
    </article>
    <div class="group">
      ${infos.map(b => `

          <span class="bill-main">
            <b>${esc(b.label)}</b>
