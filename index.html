          </span>
          <span class="bill-amt">
            <b>${b.monthly != null ? fmtMoney(b.monthly) : "—"}</b>
            <small>${b.actual ? `בפועל ${fmtMoney(b.actual)}` : "לחודש"}</small>
          </span>
        </button>`).join("")}
    </div>
    <p class="footnote">ממוצע = התשלום האחרון חלקי התדירות. לחץ על חשבון כדי לקבוע תדירות או סכום ידני (למשל ועד בית במזומן).</p>`;
}

function instBody() {
  const plans = installmentPlans();
  const active = plans.filter(p => p.active), done = plans.filter(p => !p.active);
  const lastCycle = cycleDates().slice(-1)[0];
  const ahead = [];
  if (lastCycle) for (let k = 1; k <= 6; k++) {
    const cd = addMonths(lastCycle, k);
    const sum = active.reduce((a, p) => a + (p.endCharge && p.endCharge >= cd && (p.latest.chargeDate ? addMonths(p.latest.chargeDate, 1) <= cd : true) ? p.monthly : 0), 0);
    ahead.push({ cd, sum });
  }
  const maxAhead = Math.max(1, ...ahead.map(a => a.sum));
  const planRow = p => {
    const c = catTop(p.category);
    return `
      <button class="row bill" type="button" data-tx="${p.latest.tx.id}">
        <span class="bill-main">
          <b>${esc(p.merchant)}</b>
          <small>${c ? `<span class="catchip"><i style="background:${c.color}"></i>${esc(catLabel(p.category))}</span> · ` : ""}${fmtMoney(p.amount)} ב-${p.of} תשלומים</small>
          <small>${p.active ? `${p.paidN}/${p.of} · אחרון ב${esc(cycleLabel(p.endCharge))}` : p.cancelled ? "בוטל (התקבל זיכוי)" : "הסתיים"}${p.stale ? " · לא הופיע בחודש האחרון" : ""}</small>
        </span>
        <span class="bill-amt"><b>${fmtMoney(p.monthly)}</b><small>${p.active ? `נותר ${fmtMoney(p.remainingAmount)}` : "לחודש"}</small></span>
      </button>`;
  };
  return `
    <article class="panel">
      <div class="duo">
        <div><small>פעילים</small><b class="mid-num">${active.length}</b></div>
        <div><small>נותר לשלם</small><b class="mid-num">${fmtMoney(active.reduce((a, p) => a + p.remainingAmount, 0))}</b></div>
      </div>
      ${ahead.some(a => a.sum) ? `
      <div class="minibars" role="img" aria-label="כמה יורד מכל חיוב בחודשים הבאים">
        ${ahead.map(a => `<div class="mb"><span class="mb-val">${a.sum ? Math.round(a.sum).toLocaleString("he-IL") : ""}</span>
          <span class="mb-bar"><span style="height:${Math.max(4, a.sum / maxAhead * 100).toFixed(1)}%"></span></span>
          <span class="mb-lbl">${esc(cycleLabel(a.cd).split(" ")[0])}</span></div>`).join("")}
      </div>
      <div class="note">כמה יורד מכל חיוב קדימה, מתשלומים שכבר קיימים.</div>` : ""}
    </article>
    <div class="section-label">פעילים</div>
    <div class="group">${active.length ? active.map(planRow).join("") : `<div class="row"><span class="val">אין תשלומים פעילים</span></div>`}</div>
    ${done.length ? `<details class="fold"><summary>הסתיימו (${done.length})</summary><div class="group">${done.map(planRow).join("")}</div></details>` : ""}
    <p class="footnote">חשבונות קבועים בתשלומים (כמו בר מים) מופיעים בלשונית חשבונות.</p>`;
}

/* ========= כסף: מצב כספי ========= */
function renderFinance() {
  returnTo = () => renderFinance();
  const m = moneyPicture(), f = fin();
  const dt = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("he-IL") : "";
  const num = (id, val, ph = "0") => `<input class="field small" id="${id}" type="text" inputmode="decimal" placeholder="${ph}" value="${val != null ? val : ""}">`;
  tabScreen("money", `
    <header class="pagehead"><h1>כסף</h1></header>
    <article class="hero">
      <div class="hero-label">שלי בפועל</div>
      <div class="hero-num">${fmtMoney(m.mine)}</div>
      <div class="hero-rows">
        <div><span>עו"ש${m.bankDate ? ` · ${ddmm(m.bankDate)}` : ""}</span><b>${m.bank != null ? fmtMoney(m.bank) : "—"}</b></div>
        <div><span>תיק ני"ע${m.portfolioDate ? ` · ${ddmm(m.portfolioDate)}` : ""}</span><b>${m.portfolio != null ? fmtMoney(m.portfolio) : "—"}</b></div>
        ${m.walletSum ? `<div><span>ביט, פייבוקס ומזומן</span><b>${fmtMoney(m.walletSum)}</b></div>` : ""}
        ${m.owed ? `<div><span>לא שלי</span><b>−${fmtMoney(m.owed)}</b></div>` : ""}
      </div>
      ${m.salary && m.salary.amount ? `<div class="hero-sub">משכורת חודשית ${fmtMoney(m.salary.amount)} · נכנסת ב-${m.salary.day} לחודש</div>` : ""}
    </article>

    <div class="section-label">משכורת</div>
    <div class="group">
      <div class="row"><label for="salAmt">משכורת נטו לחודש</label>${num("salAmt", m.salary ? m.salary.amount : null)}</div>
      <div class="row"><label for="salDay">יום כניסה בחודש</label>
        <select class="sel" id="salDay">${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${d === (m.salary ? m.salary.day : 9) ? "selected" : ""}>${d}</option>`).join("")}</select></div>
    </div>
    <p class="footnote">לתכנון קדימה. לא נספר בכסף שיש לך עכשיו.</p>

    <div class="section-label">עו"ש</div>
    <div class="group">
      <div class="row"><label for="bankAmt">יתרה נוכחית</label>${num("bankAmt", m.bank)}</div>
    </div>
    <p class="footnote">${m.bankDate ? `${m.bankManual ? "הוזן ידנית" : "מקובץ דיסקונט"} ב-${dt(m.bankDate)}. ` : ""}מתעדכן לבד מכל ייבוא. אם תזין ידנית, יוצג הערך העדכני מביניהם.</p>

    <div class="section-label">ארנקים ומזומן</div>
    <div class="group">
      ${m.wallets.map(w => `<div class="row"><label for="w-${w.k}">${w.l}</label>${num("w-" + w.k, w.amount)}</div>`).join("")}
    </div>
    <p class="footnote">יתרות בארנקי ביט ופייבוקס (לא בחשבון הבנק) ומזומן שיש לך ביד.</p>

    <div class="section-label">תיק ניירות ערך</div>
    <div class="group">
      <div class="row"><label for="pf">שווי נוכחי</label>${num("pf", f.portfolio ? f.portfolio.amount : null)}</div>
    </div>
    <p class="footnote">${f.portfolio && f.portfolio.asOf ? `עודכן ב-${dt(f.portfolio.asOf)}. ` : ""}מעדכנים ידנית לפי אפליקציית הבנק.</p>

    <div class="section-label">כסף מיועד (לא שלי)</div>
    <div class="group" id="ems">
      ${f.earmarks.map(e => `
        <div class="row">
          <input class="field" data-em-name="${e.id}" type="text" maxlength="30" value="${esc(e.name)}" aria-label="שם">
          <input class="field small" data-em-amt="${e.id}" type="text" inputmode="decimal" value="${e.amount}" aria-label="סכום">
          <button class="btn link danger-link" type="button" data-em-del="${e.id}">הסרה</button>
        </div>`).join("")}
      <div class="row"><button class="btn link" id="addEm" type="button">+ הוספת כסף מיועד</button></div>
    </div>
    <p class="footnote">כסף שנמצא אצלך אבל שייך למישהו אחר. הוא יורד מ"שלי בפועל".</p>
    <button class="btn" id="saveFin" type="button">שמירה</button>`);

  const val = id => { const r = document.getElementById(id).value.trim(); return r === "" ? null : parseNum(r); };
  const stamp = (prev, v) => v == null ? null : (prev && prev.amount === v ? prev : { amount: v, asOf: todayISO() });
  const collect = () => {
    const ff = fin(), mm = moneyPicture();
    ff.portfolio = stamp(ff.portfolio, val("pf"));
    const b = val("bankAmt");
    if (b == null) ff.bankManual = null;
    else if (b !== mm.bank) ff.bankManual = { amount: b, asOf: todayISO() };
    ff.wallets = Object.assign({}, ff.wallets);
    WALLETS.forEach(([k]) => { const v = val("w-" + k); if (v == null) delete ff.wallets[k]; else ff.wallets[k] = stamp(ff.wallets[k], v); });
    const sa = val("salAmt");
    ff.salary = sa == null ? null : { amount: sa, day: Number(document.getElementById("salDay").value) };
    ff.earmarks = ff.earmarks.map(e => ({
      ...e,
      name: (document.querySelector(`[data-em-name="${e.id}"]`) || {}).value?.trim() || e.name,
      amount: parseNum((document.querySelector(`[data-em-amt="${e.id}"]`) || {}).value || e.amount) || 0
    }));
    data.finance = ff;
  };
  const bad = () => ["pf", "bankAmt", "salAmt", ...WALLETS.map(w => "w-" + w[0])].some(id => { const v = val(id); return v != null && !isFinite(v); });
  document.getElementById("addEm").addEventListener("click", () => {
    if (bad()) { toast("סכום לא תקין"); return; }
    collect(); data.finance.earmarks.push({ id: newId("e"), name: "כסף מיועד", amount: 0 }); renderFinance();
  });
  document.querySelectorAll("[data-em-del]").forEach(b => b.addEventListener("click", () => {
    if (bad()) { toast("סכום לא תקין"); return; }
    collect(); data.finance.earmarks = data.finance.earmarks.filter(e => e.id !== b.dataset.emDel); renderFinance();
  }));
  document.getElementById("saveFin").addEventListener("click", async () => {
    if (bad()) { toast("סכום לא תקין"); return; }
    collect();
    await saveData(); toast("נשמר"); renderFinance();
  });
}

/* ========= עריכת קטגוריות ========= */
function renderCategories() {
  screen(`
    ${topbar("קטגוריות")}
    <p class="lead" style="max-width:none">אפשר להוסיף, לשנות שם ולמחוק. עסקאות מקטגוריה שנמחקה עוברות ל"ממתין לסיווג".</p>
    ${cats().map(c => `
      <div class="group">
        <div class="row head">
          <span class="catname"><i style="background:${c.color}"></i>${esc(c.name)}</span>
          <span>
            <button class="btn link" type="button" data-ren-top="${c.id}">שינוי שם</button>
            ${c.id !== "other" ? `<button class="btn link danger-link" type="button" data-del-top="${c.id}">מחיקה</button>` : ""}
          </span>
        </div>
        ${c.subs.map(([sid, sl]) => `
          <div class="row">
            <span>${esc(sl)}</span>
            <span>
              <button class="btn link" type="button" data-ren-sub="${c.id}/${sid}">שינוי שם</button>
              ${c.subs.length > 1 ? `<button class="btn link danger-link" type="button" data-del-sub="${c.id}/${sid}">מחיקה</button>` : ""}
            </span>
          </div>`).join("")}
        <div class="row"><button class="btn link" type="button" data-add-sub="${c.id}">+ תת-קטגוריה</button></div>
      </div>`).join("")}
    <button class="btn secondary" id="addTop" type="button">+ קטגוריה ראשית</button>`);
  document.getElementById("back").addEventListener("click", renderSettings);

  const ask = (row, value, onSave) => {
    row.innerHTML = `<input class="field" type="text" maxlength="30" value="${esc(value)}" aria-label="שם"><button class="btn link" type="button">שמירה</button>`;
    const field = row.querySelector("input"); field.focus(); field.select();
    const go = async () => { const v = field.value.trim(); if (!v) return; await onSave(v); await saveData(); renderCategories(); };
    row.querySelector("button").addEventListener("click", go);
    field.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  };
  const armed = (btn, fn) => {
    if (!btn.dataset.armed) { btn.dataset.armed = "1"; btn.textContent = "לחץ שוב למחיקה"; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = "מחיקה"; } }, 3500); return; }
    fn();
  };
  const dropKeys = pred => {
    data.tx.forEach(t => { if (t.category && pred(t.category)) { t.category = null; t.catSource = null; t.needsReview = true; } });
    for (const [k, v] of Object.entries(data.rules.merchant)) if (v && pred(v)) delete data.rules.merchant[k];
    for (const [k, v] of Object.entries(data.rules.sector)) if (v && pred(v)) data.rules.sector[k] = "";
  };
  document.querySelectorAll("[data-ren-top]").forEach(b => b.addEventListener("click", () => {
    const c = cats().find(x => x.id === b.dataset.renTop);
    ask(b.closest(".row"), c.name, v => { c.name = v; c.short = v.replace(/^דירה – /, ""); });
  }));
  document.querySelectorAll("[data-ren-sub]").forEach(b => b.addEventListener("click", () => {
    const s = subOf(b.dataset.renSub);
    ask(b.closest(".row"), s[1], v => { s[1] = v; });
  }));
  document.querySelectorAll("[data-add-sub]").forEach(b => b.addEventListener("click", () => {
    const c = cats().find(x => x.id === b.dataset.addSub);
    ask(b.closest(".row"), "", v => { c.subs.push([newId("s"), v]); });
  }));
  document.querySelectorAll("[data-del-sub]").forEach(b => b.addEventListener("click", () => armed(b, async () => {
    const key = b.dataset.delSub, c = catTop(key);
    c.subs = c.subs.filter(s => s[0] !== key.split("/")[1]);
    dropKeys(k => k === key);
    await saveData(); renderCategories(); toast("נמחק");
  })));
  document.querySelectorAll("[data-del-top]").forEach(b => b.addEventListener("click", () => armed(b, async () => {
    const id = b.dataset.delTop;
    data.cats = data.cats.filter(c => c.id !== id);
    dropKeys(k => k.split("/")[0] === id);
    await saveData(); renderCategories(); toast("נמחק");
  })));
  document.getElementById("addTop").addEventListener("click", () => {
    const btn = document.getElementById("addTop");
    const holder = document.createElement("div"); holder.className = "row"; btn.replaceWith(holder);
    ask(holder, "", v => {
      const used = data.cats.length;
      data.cats.splice(data.cats.length - 1, 0, { id: newId("c"), name: v, short: v, color: PALETTE[used % PALETTE.length], subs: [[newId("s"), "כללי"]] });
    });
  });
}

/* ========= הגדרות ========= */
async function renderSettings() {
  let persisted = null;
  try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch {}
  const vault = await getVault();
  const faceOn = hasWrap(vault, "prf"), rkOn = hasWrap(vault, "recovery");
  const faceAvail = await faceIdAvailable();
  returnTo = () => renderSettings();
  tabScreen("settings", `
    <header class="pagehead"><h1>הגדרות</h1><button class="icon-btn" id="lockNow2" type="button" aria-label="נעילה עכשיו">${ICON_LOCK}</button></header>

    <div class="section-label">נעילה אוטומטית</div>
    <div class="group">
      <div class="seg" role="group" aria-label="נעילה אוטומטית">
        ${AUTO_LOCK.map(a => `<button type="button" data-s="${a.s}" aria-pressed="${a.s === settings.autoLock}">${a.label}</button>`).join("")}
      </div>
    </div>

    <div class="section-label">אבטחה</div>
    <div class="group">
      <div class="row"><button class="row-btn" id="faceBtn" type="button"><span>Face ID</span><span class="val">${faceOn ? "פעיל ‹" : faceAvail ? "הפעלה ‹" : "לא זמין"}</span></button></div>
      <div class="row"><button class="row-btn" id="rkBtn" type="button"><span>מפתח שחזור</span><span class="val">${rkOn ? "נוצר ‹" : "יצירה ‹"}</span></button></div>
      <div class="row"><button class="row-btn" id="changeCode" type="button"><span>שינוי קוד גישה</span><span class="val">‹</span></button></div>
      <div class="row"><span>אחסון קבוע בדפדפן</span><span class="val">${persisted === true ? "מאושר" : persisted === false ? "לא מאושר" : "לא ידוע"}</span></div>
    </div>
    <p class="footnote">הנתונים מוצפנים ונשמרים במכשיר הזה בלבד. אם תשכח את הקוד, רק מפתח השחזור יכול לפתוח אותם.</p>

    <div class="section-label">כרטיסים</div>
    <div class="group">
      ${data.cards.length ? data.cards.map(c => `
        <div class="row">
          <div><div>${esc(c.nickname)}</div><div class="val">כאל${c.product ? " · " + esc(c.product) : ""} · ••${esc(c.last4)}</div></div>
          <button class="btn link" type="button" data-rename="${c.id}">שינוי שם</button>
        </div>`).join("") : `<div class="row"><span class="val">עוד לא יובאו כרטיסים</span></div>`}
    </div>

    <div class="section-label">סיווג</div>
    <div class="group">
      <div class="row"><button class="row-btn" id="catsBtn" type="button"><span>קטגוריות</span><span class="val">‹</span></button></div>
      <div class="row"><button class="row-btn" id="rulesBtn" type="button"><span>כללי סיווג</span><span class="val">‹</span></button></div>
    </div>

    <div class="section-label">גרסה</div>
    <div class="group">
      <div class="row"><span>גרסה מותקנת</span><span class="val" style="direction:ltr">${APP_VERSION}</span></div>
      <div class="row"><button class="row-btn" id="checkUpdate" type="button"><span>בדיקת עדכונים</span><span class="val">‹</span></button></div>
    </div>

    <div class="section-label">מתקדם</div>
    <div class="group">
      <div class="row"><button class="row-btn" id="advBtn" type="button"><span>גיבוי וניהול נתונים</span><span class="val">‹</span></button></div>
    </div>`);
  document.getElementById("lockNow2").addEventListener("click", lock);
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", async () => {
    settings.autoLock = Number(b.dataset.s);
    await saveSettings();
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    toast("נשמר");
  }));
  document.getElementById("changeCode").addEventListener("click", () => renderVerifyCode({
    title: "הזן את הקוד הנוכחי", onCancel: renderSettings,
    onOk: raw => renderNewCode(raw, { afterSave: async r => { r.fill(0); renderSettings(); toast("הקוד עודכן"); }, cancel: () => { raw.fill(0); renderSettings(); } })
  }));
  document.getElementById("faceBtn").addEventListener("click", () => faceOn ? renderFaceOn() : faceAvail ? renderFaceEnable() : toast("Face ID לא זמין בדפדפן הזה"));
  document.getElementById("rkBtn").addEventListener("click", () => renderRecoveryIntro(rkOn));
  document.getElementById("rulesBtn").addEventListener("click", renderRules);
  document.getElementById("catsBtn").addEventListener("click", renderCategories);
  document.getElementById("checkUpdate").addEventListener("click", () => checkForUpdate(true));
  document.getElementById("advBtn").addEventListener("click", renderAdvanced);
  document.querySelectorAll("[data-rename]").forEach(btn => btn.addEventListener("click", () => {
    const card = data.cards.find(c => c.id === btn.dataset.rename);
    const row = btn.closest(".row");
    row.innerHTML = `<input class="field" type="text" maxlength="30" value="${esc(card.nickname)}" aria-label="שם הכרטיס"><button class="btn link" type="button">שמירה</button>`;
    const field = row.querySelector("input");
    field.focus(); field.select();
    const commit = async () => { card.nickname = field.value.trim() || card.nickname; await saveData(); toast("השם עודכן"); renderSettings(); };
    row.querySelector("button").addEventListener("click", commit);
    field.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  }));
}

function renderFaceEnable() {
  screen(`
    ${topbar("Face ID")}
    <div class="card col">
      <h3>כניסה במבט אחד</h3>
      <p>האייפון ייצור Passkey בשם "מעקב הוצאות" באפליקציית הסיסמאות. בכל כניסה Face ID יפתח את ההצפנה. קוד הגישה נשאר תמיד כגיבוי.</p>
      <p class="note">קודם תתבקש להזין את קוד הגישה, ואז לאשר עם Face ID (אולי פעמיים).</p>
    </div>
    <div style="flex:1"></div>
    <button class="btn" id="go" type="button">המשך</button>`);
  document.getElementById("back").addEventListener("click", renderSettings);
  document.getElementById("go").addEventListener("click", () => renderVerifyCode({
    title: "הזן קוד גישה", onCancel: renderSettings,
    onOk: raw => {
      screen(`
        ${topbar("Face ID")}
        <div class="card col"><h3>מוכן</h3><p>לחץ על הכפתור כדי לאשר עם Face ID.</p></div>
        <p class="err" id="faceErr" hidden></p>
        <div style="flex:1"></div>
        <button class="btn" id="create" type="button">הפעלת Face ID</button>`);
      document.getElementById("back").addEventListener("click", () => { raw.fill(0); renderSettings(); });
      document.getElementById("create").addEventListener("click", async () => {
        const btn = document.getElementById("create"), err = document.getElementById("faceErr");
        btn.disabled = true; btn.textContent = "ממתין ל-Face ID…"; err.hidden = true;
        try {
          await enableFaceId(raw);
          raw.fill(0);
          renderSettings(); toast("Face ID הופעל");
        } catch (e) {
          btn.disabled = false; btn.textContent = "נסה שוב";
          err.textContent = e && e.message === "no-prf"
            ? "הדפדפן או המכשיר לא תומכים בפתיחת הצפנה עם Face ID. הכניסה עם הקוד ממשיכה לעבוד."
            : e && e.name === "NotAllowedError" ? "הפעולה בוטלה. אפשר לנסות שוב." : "ההפעלה נכשלה. אפשר לנסות שוב.";
          err.hidden = false;
        }
      });
    }
  }));
}

function renderFaceOn() {
  screen(`
    ${topbar("Face ID")}
    <div class="card col"><h3>Face ID פעיל</h3><p>במסך הנעילה לחץ על "Face ID" כדי להיכנס.</p></div>

}

function renderRecoveryIntro(exists) {
  screen(`
    ${topbar("מפתח שחזור")}
    <div class="card col">
      <h3>${exists ? "כבר יש מפתח שחזור" : "רשת ביטחון אם תשכח את הקוד"}</h3>
      <p>מפתח השחזור הוא רצף של 28 תווים שפותח את הנתונים במקום הקוד. שמור אותו באפליקציית הסיסמאות של האייפון. כל מי שמחזיק בו יכול לפתוח את האפליקציה, אז אל תשלח אותו לאף אחד.</p>
      ${exists ? `<p class="note">יצירת מפתח חדש מבטלת את הקודם.</p>` : ""}
    </div>
    <div style="flex:1"></div>
    <button class="btn" id="go" type="button">${exists ? "יצירת מפתח חדש" : "יצירת מפתח"}</button>
    ${exists ? `<button class="btn danger" id="del" type="button">ביטול מפתח השחזור</button>` : ""}`);
  document.getElementById("back").addEventListener("click", renderSettings);
  const del = document.getElementById("del");
  if (del) del.addEventListener("click", () => renderVerifyCode({ title: "הזן קוד כדי לבטל", onCancel: renderSettings,
    onOk: async raw => { raw.fill(0); await removeWrap("recovery"); renderSettings(); toast("מפתח השחזור בוטל"); } }));
  document.getElementById("go").addEventListener("click", () => renderVerifyCode({
    title: "הזן קוד גישה", onCancel: renderSettings,
    onOk: async raw => {
      const key = newRecoveryKey();
      await storeRecovery(key, raw);
      raw.fill(0);
      screen(`
        ${topbar("מפתח השחזור שלך", "סיום")}
        <p class="lead" style="max-width:none">שמור אותו עכשיו. הוא לא יוצג שוב.</p>
        <div class="rk mono" id="rkText">${key}</div>
        <button class="btn secondary" id="copy" type="button">העתקה</button>
        <div class="card col">
          <h3>לשמירה באפליקציית הסיסמאות</h3>
          <p>סיסמאות ← ➕ ← אתר: "מעקב הוצאות", שם משתמש: "מפתח שחזור", סיסמה: הדבק את המפתח.</p>
        </div>`);
      document.getElementById("back").addEventListener("click", renderSettings);
      document.getElementById("copy").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(key); toast("הועתק"); } catch { toast("סמן את המפתח והעתק ידנית"); }
      });
    }
  }));
}

function renderRules() {
  const sectors = [...new Set(data.tx.map(t => t.branch || "").filter(Boolean))].sort();
  const mrules = Object.entries(data.rules.merchant).sort((a, b) => a[0].localeCompare(b[0], "he"));
  const opts = sel => `<option value="" ${!sel ? "selected" : ""}>ממתין לסיווג</option>` +
    allSubs().map(s => `<option value="${s.key}" ${sel === s.key ? "selected" : ""}>${esc(s.label)}</option>`).join("");
  screen(`
    ${topbar("כללי סיווג")}
    <p class="lead" style="max-width:none">סדר העדיפויות: קודם סיווג ידני של עסקה, אחר כך כלל לבית העסק, ואז הענף של כאל.</p>
    <div class="section-label">לפי ענף בכאל</div>
    <div class="group">
      ${sectors.length ? sectors.map(s => {
        const cur = s in data.rules.sector ? data.rules.sector[s] : (DEFAULT_SECTOR[s] || "");
        return `<div class="row"><label for="sec-${esc(s)}">${esc(s)}</label><select class="sel" id="sec-${esc(s)}" data-sector="${esc(s)}">${opts(cur)}</select></div>`;
      }).join("") : `<div class="row"><span class="val">עוד אין עסקאות</span></div>`}
    </div>
    <div class="section-label">לפי בית עסק (נוצרים כשמסווגים עסקה)</div>
    <div class="group">
      ${mrules.length ? mrules.map(([k, v]) => `
        <div class="row"><div><div>${esc(k)}</div><div class="val">${esc(catLabel(v, true))}</div></div>
        <button class="btn link" type="button" data-delrule="${esc(k)}">הסרה</button></div>`).join("")
        : `<div class="row"><span class="val">עוד אין כללים</span></div>`}
    </div>`);
  document.getElementById("back").addEventListener("click", renderSettings);
  document.querySelectorAll("[data-sector]").forEach(s => s.addEventListener("change", async () => {
    data.rules.sector[s.dataset.sector] = s.value;
    reclassifyAll(); await saveData(); toast("עודכן");
  }));
  document.querySelectorAll("[data-delrule]").forEach(b => b.addEventListener("click", async () => {
    delete data.rules.merchant[b.dataset.delrule];
    reclassifyAll(); await saveData(); renderRules(); toast("הכלל הוסר");
  }));
}

function renderAdvanced() {
  screen(`
    ${topbar("גיבוי וניהול נתונים")}
    <div class="card col">
      <h3>מה שמור במכשיר</h3>
      <p>${data.cards.length} כרטיסים · ${(data.accounts || []).length} חשבונות · ${data.statements.length} חודשים · ${data.tx.length} תנועות · ${Object.keys(data.rules.merchant).length} כללי סיווג</p>
    </div>
    <div class="section-label">גיבוי מוצפן</div>
    <div class="group">
      <div class="row"><button class="row-btn" id="doBackup" type="button"><span>יצירת קובץ גיבוי</span><span class="val">‹</span></button></div>
      <div class="row"><label class="row-btn" for="restoreFile"><span>שחזור מקובץ גיבוי</span><span class="val">‹</span></label>
        <input id="restoreFile" type="file" accept=".json,application/json" hidden></div>
    </div>
    <p class="footnote">הגיבוי מוצפן: נפתח רק עם קוד הגישה (או מפתח השחזור) שהיה בזמן הגיבוי. שמור אותו ב-iCloud Drive. כדאי לגבות אחרי כל ייבוא חודשי.</p>
    <div style="flex:1"></div>
    <button class="btn danger" id="wipe" type="button">מחיקת כל הנתונים…</button>
    <p class="footnote">המחיקה דורשת קוד גישה ואישור נוסף.</p>`);
  document.getElementById("back").addEventListener("click", renderSettings);
  document.getElementById("doBackup").addEventListener("click", async () => {
    try { const r = await exportBackup(); if (r !== "cancel") { settings.lastBackup = todayISO(); await saveSettings(); toast("הגיבוי נוצר"); } }
    catch { toast("יצירת הגיבוי נכשלה"); }
  });
  document.getElementById("restoreFile").addEventListener("change", e => pickRestore(e.target, renderAdvanced));
  document.getElementById("wipe").addEventListener("click", () => renderVerifyCode({
    title: "הזן קוד כדי להמשיך", onCancel: renderAdvanced,
    onOk: raw => { raw.fill(0); renderWipeConfirm(renderAdvanced); }
  }));
}

async function pickRestore(input, onCancel) {
  const f = input.files && input.files[0]; input.value = "";
  if (!f) return;
  let obj;
  try { obj = await readBackup(f); } catch { toast("זה לא קובץ גיבוי של האפליקציה"); return; }
  screen(`
    ${topbar("שחזור מגיבוי", "ביטול")}
    <div class="card col danger-card">
      <h3>הנתונים הנוכחיים במכשיר יוחלפו</h3>
      <p>גיבוי מ-${new Date(obj.createdAt).toLocaleDateString("he-IL")}. אחרי השחזור תתבקש להזין את קוד הגישה שהיה בזמן הגיבוי.</p>
    </div>
    <button class="btn danger" id="doRestore" type="button">שחזור</button>`);
  document.getElementById("back").addEventListener("click", onCancel);
  document.getElementById("doRestore").addEventListener("click", async () => {
    try { await restoreBackup(obj); dek = null; settings = null; data = null; state = "locked"; renderLock(); toast("שוחזר. הזן את הקוד"); }
    catch { toast("השחזור נכשל"); }
  });
}

/* ========= עדכוני גרסה ========= */
let lastUpdateCheck = 0;
async function checkForUpdate(manual = false) {
  lastUpdateCheck = Date.now();
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("http");
    const { version } = await r.json();
    const available = version !== APP_VERSION;
    document.getElementById("updateBar").hidden = !available;
    if (manual) toast(available ? `גרסה ${version} זמינה` : "האפליקציה מעודכנת");
  } catch {
    if (manual) toast("אין חיבור לבדיקה. נסה שוב מאוחר יותר");
  }
}
async function applyUpdate() {
  const btn = document.getElementById("doUpdate");
  if (btn) { btn.disabled = true; btn.textContent = "מעדכן…"; }
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  location.reload();
}

/* ========= רקע וחזרה ========= */
function onHidden() {
  if (state !== "unlocked") return;
  cover.classList.add("show");
  if (settings && settings.autoLock === 0) lock();
  else hiddenAt = hiddenAt || Date.now();
}
function onVisible() {
  if (state === "unlocked" && hiddenAt && settings && Date.now() - hiddenAt >= settings.autoLock * 1000) lock();
  hiddenAt = null;
  cover.classList.remove("show");
  if (Date.now() - lastUpdateCheck > 10 * 60 * 1000) checkForUpdate();
}
document.addEventListener("visibilitychange", () => document.hidden ? onHidden() : onVisible());
window.addEventListener("pagehide", onHidden);
window.addEventListener("pageshow", e => { if (e.persisted) onVisible(); });

/* ========= הפעלה ========= */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
document.getElementById("doUpdate").addEventListener("click", applyUpdate);

(async function boot() {
  checkForUpdate();
  if (!window.crypto || !crypto.subtle) {
    screen(`<h1>הדפדפן לא נתמך</h1><p class="lead">צריך Safari או Chrome עדכני.</p>`, "center");
    return;
  }
  try { await pickBackend(); }
  catch {
    screen(`
      <h1>אין גישה לאחסון</h1>
      <p class="lead">הדפדפן חוסם שמירת נתונים באתר הזה. בדרך כלל הסיבה היא אחת מאלה:</p>
      <div class="group" style="text-align:right;width:100%">
        <div class="row"><span>גלישה פרטית: פתח בחלון רגיל</span></div>
        <div class="row"><span>הגדרות ← אפליקציות ← Safari ← "חסום את כל העוגיות": לכבות</span></div>
        <div class="row"><span>מצב נעילה (Lockdown Mode) פעיל</span></div>
      </div>
      <button class="btn" id="retry" type="button">נסה שוב</button>
      <p class="footnote" style="direction:ltr">${esc(lastStorageError)}</p>`, "center");
    document.getElementById("retry").addEventListener("click", () => location.reload());
    return;
  }
  try {
    const vault = await getVault();
    if (vault) { state = "locked"; renderLock(); }
    else { state = "setup"; renderWelcome(); }
  } catch (e) {
    screen(`<h1>שגיאה בקריאת הנתונים</h1><p class="footnote" style="direction:ltr">${esc((e && (e.name + " " + e.message)) || e)}</p><button class="btn" type="button" onclick="location.reload()">נסה שוב</button>`, "center");
  }
})();

</script>
